[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sciflow-agent"
description = "Agentic scientific-image-analysis app: natural-language requests become validated, reproducible image-processing workflows."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "streamlit>=1.37,<2",
    "numpy>=1.26,<3",
    "pillow>=10.3,<12",
    "scikit-image>=0.26,<1",
    "pandas>=2.2,<3",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
]

[project.urls]
Repository = "https://github.com/shuvanon/SciFlow-Agent"
Issues = "https://github.com/shuvanon/SciFlow-Agent/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
]

[tool.setuptools]
packages = ["src", "src.agent", "src.tools"]

[tool.setuptools.dynamic]
version = { attr = "src.__version__" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
allowed-confusables = ["×", "–"]  # legitimate dimension/range separators in UI text
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
